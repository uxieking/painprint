<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>PAINPRINT</title>
  <meta name="description" content="PAINPRINT – patients draw exactly where it hurts on an interactive body map and share a structured pain report with their clinician.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2713%27 fill=%27none%27 stroke=%27%2318202c%27 stroke-width=%272.5%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%274%27 fill=%27%23e4572e%27/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <div class="brand" aria-label="PAINPRINT">
        <svg viewBox="0 0 32 32" class="logo" aria-hidden="true"><circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="2.5"/><circle cx="16" cy="16" r="7" fill="none" stroke="currentColor" stroke-width="2" opacity=".55"/><circle cx="16" cy="16" r="3.2" fill="var(--pain)"/></svg>
        <span>PAIN<b>PRINT</b></span>
      </div>
      <nav class="crumbs" aria-label="View">
        <button id="btnOverview" class="crumb" type="button">Full body</button>
        <span id="crumbSep" class="crumb-sep" hidden>›</span>
        <span id="crumbRegion" class="crumb-current"></span>
      </nav>
      <div class="top-actions">
        <span id="saveStatus" class="save-status" role="status"></span>
        <button id="btnReport" class="btn primary" type="button" data-icon="report"><span>Report</span></button>
        <div class="menu-wrap">
          <button id="btnMenu" class="btn icon-only" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Menu" data-icon="menu"></button>
          <div id="menu" class="menu" role="menu" hidden>
            <button role="menuitem" data-act="demo">Load sample patient</button>
            <button role="menuitem" data-act="patient">Patient details</button>
            <button role="menuitem" data-act="types">Edit pain types</button>
            <hr>
            <button role="menuitem" data-act="export">Export entries (JSON)</button>
            <button role="menuitem" data-act="import">Import entries / backup</button>
            <button role="menuitem" data-act="backup">Download full backup</button>
            <hr>
            <button role="menuitem" data-act="help">Help &amp; shortcuts</button>
            <button role="menuitem" data-act="reset" class="danger">Delete all data</button>
          </div>
        </div>
      </div>
    </header>

    <main class="layout">
      <section class="work">
        <div class="toolbar" role="toolbar" aria-label="Tools">
          <div class="seg" id="tools">
            <button class="tool nav" data-tool="nav" title="Navigate: pan and zoom (V)" data-icon="hand"><span>Navigate</span></button>
            <span class="seg-div" aria-hidden="true"></span>
            <button class="tool" data-tool="draw" title="Brush: freehand drawing (B)" data-icon="pen"><span>Brush</span></button>
            <button class="tool" data-tool="area" title="Area: outline an area (A)" data-icon="area"><span>Area</span></button>
            <button class="tool" data-tool="arrow" title="Arrow: show radiating pain (R)" data-icon="arrow"><span>Arrow</span></button>
            <button class="tool" data-tool="erase" title="Eraser – erases in the active entry (E)" data-icon="eraser"><span>Eraser</span></button>
          </div>
          <div class="types" id="typePalette" role="radiogroup" aria-label="Pain type and color"></div>
          <label class="brush" title="Brush size">
            <span class="brush-dot" id="brushDot"></span>
            <input type="range" id="brush" min="2" max="48" step="1" aria-label="Brush size">
          </label>
          <div class="hist">
            <button class="btn icon-only" id="btnUndo" title="Undo (Ctrl+Z)" aria-label="Undo" data-icon="undo"></button>
            <button class="btn icon-only" id="btnRedo" title="Redo (Ctrl+Y)" aria-label="Redo" data-icon="redo"></button>
            <button class="btn icon-only" id="btnClear" title="Clear drawings" aria-label="Clear drawings" data-icon="trash"></button>
          </div>
        </div>

        <div class="stage-wrap">
          <div id="stage" class="stage tool-nav" aria-label="Body map. Select a region or draw.">
            <svg id="canvas" xmlns="http://www.w3.org/2000/svg">
              <g id="world"></g>
            </svg>
          </div>
          <button id="modeBadge" class="mode-badge" type="button"></button>
          <div id="hoverPill" class="hover-pill" hidden></div>
          <div id="brushCursor" class="brush-cursor" hidden></div>
          <div class="zoomctl">
            <button class="btn icon-only" id="zoomIn" aria-label="Zoom in" data-icon="plus"></button>
            <span id="zoomLabel" class="zoom-label">100%</span>
            <button class="btn icon-only" id="zoomOut" aria-label="Zoom out" data-icon="minus"></button>
            <button class="btn icon-only" id="zoomFit" aria-label="Fit view" title="Fit (0)" data-icon="fit"></button>
          </div>
          <label class="region-select">
            <span class="sr-only">Select region</span>
            <select id="regionSelect"></select>
          </label>
          <div id="toast" class="toast" role="status" hidden></div>
        </div>
      </section>

      <aside class="panel" id="panel">
        <div class="panel-head">
          <button class="panel-toggle" id="panelToggle" type="button" aria-expanded="true" data-icon="chev"></button>
          <h2>Pain entries</h2>
          <button class="btn small" id="btnNewEntry" type="button" data-icon="plus"><span>New</span></button>
        </div>
        <div class="panel-body">
          <ul class="entries" id="entryList"></ul>
          <div id="editor" class="editor"></div>
        </div>
      </aside>
    </main>
  </div>

  <div id="reportOverlay" class="report-overlay" hidden>
    <div class="report-bar">
      <button class="btn" id="reportClose" type="button" data-icon="back"><span>Back</span></button>
      <span class="report-bar-title">Patient report</span>
      <button class="btn primary" id="reportPrint" type="button" data-icon="report"><span>Print / save PDF</span></button>
    </div>
    <div id="report" class="report"></div>
  </div>

  <dialog id="dlg" class="dlg"></dialog>
  <input type="file" id="fileImport" accept="application/json,.json" hidden>

  <script src="js/geom.js"></script>
  <script src="js/vocab.js"></script>
  <script src="js/body.js"></script>
  <script src="js/store.js"></script>
  <script src="js/render.js"></script>
  <script src="js/exchange.js"></script>
  <script src="js/demo.js"></script>
  <script src="js/report.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
